<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Whashed Kids Club Radio</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;

            background:
                radial-gradient(circle at 20% 20%, #f6c9d9 0%, transparent 30%),
                radial-gradient(circle at 80% 10%, #b9c9f5 0%, transparent 35%),
                radial-gradient(circle at 50% 90%, #c9b7e8 0%, transparent 40%),
                #9eacd9;

            color: #20243a;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 30px;
        }

        .radio {
            width: 900px;
            max-width: 100%;

            background: rgba(235, 232, 246, 0.88);

            border: 3px solid #454b72;
            border-radius: 18px;

            box-shadow:
                0 20px 60px rgba(40, 45, 80, 0.35),
                inset 0 0 25px rgba(255, 255, 255, 0.5);

            overflow: hidden;
        }

        /* TOP BAR */

        .topbar {
            background: #59638f;
            color: #f8dce8;

            padding: 12px 18px;

            display: flex;
            justify-content: space-between;
            align-items: center;

            border-bottom: 2px solid #3e456c;
        }

        .logo {
            font-size: 20px;
            font-weight: 900;
            letter-spacing: 2px;
        }

        .on-air {
            font-size: 12px;
            font-weight: bold;
            letter-spacing: 2px;

            background: #f4b7cd;
            color: #403f68;

            padding: 6px 10px;
            border-radius: 20px;
        }

        /* MAIN PLAYER */

        .player {
            padding: 30px;

            display: grid;
            grid-template-columns: 220px 1fr;

            gap: 30px;
        }

        .album-art {
            width: 220px;
            height: 220px;

            border-radius: 12px;

            background:
                linear-gradient(
                    135deg,
                    #8da2d6,
                    #c8b4e5,
                    #f1bfd3
                );

            border: 3px solid #555d87;

            display: flex;
            align-items: center;
            justify-content: center;

            text-align: center;

            color: white;

            font-size: 28px;
            font-weight: 900;

            letter-spacing: 3px;

            box-shadow:
                inset 0 0 25px rgba(255,255,255,.35),
                0 8px 20px rgba(50,50,80,.25);
        }

        .now-playing {
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .eyebrow {
            font-size: 11px;
            font-weight: bold;
            letter-spacing: 3px;

            color: #737da8;

            margin-bottom: 8px;
        }

        .track-title {
            font-size: 34px;
            font-weight: 900;

            margin: 0 0 8px;

            color: #363b62;
        }

        .artist {
            font-size: 18px;

            color: #747aa0;

            margin-bottom: 25px;
        }

        /* PROGRESS */

        .progress {
            height: 10px;

            background: #c3c5d9;

            border-radius: 10px;

            overflow: hidden;

            margin-bottom: 8px;
        }

        .progress-bar {
            width: 35%;
            height: 100%;

            background: #d992b1;
        }

        .time {
            display: flex;
            justify-content: space-between;

            font-size: 11px;

            color: #737895;
        }

        /* CONTROLS */

        .controls {
            display: flex;
            gap: 10px;

            margin-top: 25px;
        }

        button {
            border: none;

            background: #707ba8;
            color: white;

            width: 45px;
            height: 40px;

            border-radius: 8px;

            font-size: 17px;

            cursor: pointer;

            transition: .2s;
        }

        button:hover {
            background: #d58cab;

            transform: translateY(-2px);
        }

        .play {
            width: 65px;

            background: #d58cab;

            font-size: 20px;
        }

        /* EQUALIZER */

        .equalizer {
            height: 70px;

            display: flex;
            align-items: end;

            gap: 5px;

            padding: 10px 30px 20px;

            border-top: 1px solid #b7b8cc;
        }

        .bar {
            flex: 1;

            height: 20%;

            background: #8898cc;

            border-radius: 4px 4px 0 0;
        }

        .bar:nth-child(2) { height: 50%; }
        .bar:nth-child(3) { height: 75%; }
        .bar:nth-child(4) { height: 35%; }
        .bar:nth-child(5) { height: 90%; }
        .bar:nth-child(6) { height: 60%; }
        .bar:nth-child(7) { height: 40%; }
        .bar:nth-child(8) { height: 80%; }
        .bar:nth-child(9) { height: 55%; }
        .bar:nth-child(10) { height: 70%; }

        /* PLAYLIST */

        .playlist {
            background: rgba(80, 88, 130, .12);

            border-top: 2px solid #b6b7cb;

            padding: 20px 30px 30px;
        }

        .playlist-title {
            font-size: 13px;
            font-weight: bold;

            letter-spacing: 2px;

            color: #5b638e;

            margin-bottom: 12px;
        }

        .track {
            padding: 12px 15px;

            display: flex;
            justify-content: space-between;

            border-radius: 7px;

            color: #525978;

            cursor: pointer;
        }

        .track:hover {
            background: rgba(213, 140, 171, .18);
        }

        .track.active {
            background: #d9b0c6;

            color: #373a5b;

            font-weight: bold;
        }

        .track-number {
            width: 35px;
        }

        .track-name {
            flex: 1;
        }

        .duration {
            opacity: .7;
        }

        /* MOBILE */

        @media (max-width: 700px) {

            body {
                padding: 10px;
            }

            .player {
                grid-template-columns: 1fr;

                text-align: center;
            }

            .album-art {
                margin: auto;
            }

            .controls {
                justify-content: center;
            }

            .track-title {
                font-size: 26px;
            }
        }

    </style>
</head>

<body>

    <main class="radio">

        <header class="topbar">

            <div class="logo">
                WHASHED KIDS CLUB
            </div>

            <div class="on-air">
                ● WKC RADIO
            </div>

        </header>


        <section class="player">

            <div class="album-art">
                WKC<br>RADIO
            </div>


            <div class="now-playing">

                <div class="eyebrow">
                    NOW PLAYING
                </div>

                <h1 class="track-title">
                    WKC RADIO
                </h1>

                <div class="artist">
                    Whashed Kids Club
                </div>


                <div class="progress">

                    <div class="progress-bar"></div>

                </div>


                <div class="time">

                    <span>00:00</span>

                    <span>00:00</span>

                </div>


                <div class="controls">

                    <button>⏮</button>

                    <button class="play">▶</button>

                    <button>⏭</button>

                    <button>↻</button>

                </div>

            </div>

        </section>


        <section class="equalizer">

            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>

        </section>


        <section class="playlist">

            <div class="playlist-title">
                WKC PLAYLIST
            </div>


            <div class="track active">

                <span class="track-number">01</span>

                <span class="track-name">
                    WKC Radio — Welcome
                </span>

                <span class="duration">
                    --:--
                </span>

            </div>


            <div class="track">

                <span class="track-number">02</span>

                <span class="track-name">
                    The Velvet Suns — Static Dreams
                </span>

                <span class="duration">
                    --:--
                </span>

            </div>


            <div class="track">

                <span class="track-number">03</span>

                <span class="track-name">
                    Sunshine Static
                </span>

                <span class="duration">
                    --:--
                </span>

            </div>


            <div class="track">

                <span class="track-number">04</span>

                <span class="track-name">
                    WKC After Hours
                </span>

                <span class="duration">
                    --:--
                </span>

            </div>

        </section>

    </main>

</body>
</html>
